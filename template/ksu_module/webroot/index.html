<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KsuFrida</title>
    <style>
        /* Roboto Flex variable (latin) is bundled so the offline WebUI needs
           no network. OFL-1.1, (c) Google; source: github.com/google/fonts. */
        @font-face {
            font-family: "Roboto Flex";
            font-style: normal;
            font-weight: 100 1000;
            font-display: swap;
            src: url("fonts/RobotoFlex-latin.woff2") format("woff2");
        }

        /* Scale: type base 13px/1.45, micro 11px/1.5/+.12em, wordmark 17px/.18em.
           Space: 4 / 8 / 12 / 16 (8 for tight control clusters, 6 for label gaps).
           Radius: 6 rows / 8 controls / 10 cards / 12 modal / 999 pills. */
        :root {
            --font-sans: "Roboto Flex", "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-mono: "Roboto Mono", ui-monospace, "Droid Sans Mono", SFMono-Regular, Menlo, Consolas, monospace;
            --primary: #e2604f;
            --accent: #e2604f;
            --accent-ink: #2b100c;
            --danger: #cd6f5e;
            --success: #549b7a;
            --warn: #c79a48;
            --bg: #141013;
            --surface: #1c181d;
            --surface2: #231e24;
            --inset: #100d10;
            --text: #f1ecec;
            --text2: #b3a6a8;
            --faint: #6f6367;
            --border: rgba(241,236,236,.09);
            --border-strong: rgba(241,236,236,.20);
            /* M3 Expressive motion (web fallback curves). Spatial moves/
               resizes (bounces, y1>1); effects carries color/opacity
               (damping 1.0, never overshoots). Fast = small parts,
               default = most, slow = full-screen. */
            --ease-spatial-fast: cubic-bezier(0.42, 1.67, 0.21, 0.90);
            --ease-spatial-default: cubic-bezier(0.38, 1.21, 0.22, 1.00);
            --ease-spatial-slow: cubic-bezier(0.39, 1.29, 0.35, 0.98);
            --ease-effects-fast: cubic-bezier(0.31, 0.94, 0.34, 1.00);
            --ease-effects-default: cubic-bezier(0.34, 0.80, 0.34, 1.00);
            --ease-effects-slow: cubic-bezier(0.34, 0.88, 0.34, 1.00);
            --ease-exit: cubic-bezier(0.30, 0.00, 0.80, 0.15);
            --dur-spatial-fast: 350ms;
            --dur-spatial-default: 500ms;
            --dur-effects-fast: 150ms;
            --dur-effects-default: 200ms;
            --dur-effects-slow: 300ms;
            --stagger-step: 35ms;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            line-height: 1.45;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            /* Touch feel: no double-tap zoom delay, no highlight flash, and no
               accidental long-press text selection (which locks scrolling). */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Text that has to stay selectable for manual copy/paste. */
        input, textarea, select, .cmd, .app-label {
            -webkit-user-select: text;
            user-select: text;
        }

        .container { width: 100%; max-width: 600px; }

        .header { margin: 2px 2px 12px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .header h1 { font-size: 17px; letter-spacing: .18em; font-weight: 700; line-height: 1.3; }
        .header p { color: var(--text2); font-size: 12px; margin-top: 4px; letter-spacing: .02em; }
        .dirty {
            color: var(--warn);
            font-size: 12px;
            line-height: 1.5;
            font-weight: 600;
            font-family: var(--font-mono);
        }

        /* Zero footprint when empty: grid rows animate 0fr to 1fr, else snap.
           Single wrapper child required: extra grid items open implicit
           auto rows that no setting can close.
           Visibility flips discretely so hidden controls stay unfocusable.
           Resize rides the spatial spring; opacity rides effects. */
        .collapse {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            visibility: hidden;
            overflow: hidden;
            transition: grid-template-rows var(--dur-spatial-fast) var(--ease-spatial-fast),
                opacity var(--dur-effects-fast) var(--ease-effects-fast),
                margin-top var(--dur-spatial-fast) var(--ease-spatial-fast),
                visibility 0s var(--dur-spatial-fast);
        }

        .collapse.show {
            grid-template-rows: 1fr;
            opacity: 1;
            visibility: visible;
            margin-top: 8px;
            transition: grid-template-rows var(--dur-spatial-fast) var(--ease-spatial-fast),
                opacity var(--dur-effects-fast) var(--ease-effects-fast),
                margin-top var(--dur-spatial-fast) var(--ease-spatial-fast),
                visibility 0s 0s;
        }

        .collapse > * { overflow: hidden; min-height: 0; }

        .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 0 rgba(0,0,0,.45);
            animation: card-in var(--dur-spatial-default) var(--ease-spatial-default) backwards;
        }

        /* One hero entrance per load: cards cascade, rows follow inside. */
        @keyframes card-in {
            from { opacity: 0; transform: translateY(12px) scale(.985); }
        }

        .container > .card:nth-child(2) { animation-delay: 0ms; }
        .container > .card:nth-child(3) { animation-delay: 60ms; }
        .container > .card:nth-child(4) { animation-delay: 120ms; }
        .container > .card:nth-child(5) { animation-delay: 180ms; }

        /* Status only reads out, so it stays chromeless; workflows keep cards. */
        .card.quiet {
            background: transparent;
            border-color: transparent;
            box-shadow: none;
            padding: 4px 4px;
        }

        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title h3 { font-size: 11px; line-height: 1.5; text-transform: uppercase; letter-spacing: .12em; color: var(--text2); font-weight: 700; }

        .target-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            min-height: 58px;
            cursor: pointer;
            transition: border-color var(--dur-effects-default) var(--ease-effects-default),
                background-color var(--dur-effects-default) var(--ease-effects-default),
                transform var(--dur-spatial-fast) var(--ease-spatial-fast);
            animation: row-in var(--dur-spatial-fast) var(--ease-spatial-fast) backwards;
        }

        /* Stagger caps at 8 so long lists settle under ~600ms. */
        #targets .target-row:nth-child(2) { animation-delay: calc(var(--stagger-step) * 1); }
        #targets .target-row:nth-child(3) { animation-delay: calc(var(--stagger-step) * 2); }
        #targets .target-row:nth-child(4) { animation-delay: calc(var(--stagger-step) * 3); }
        #targets .target-row:nth-child(5) { animation-delay: calc(var(--stagger-step) * 4); }
        #targets .target-row:nth-child(6) { animation-delay: calc(var(--stagger-step) * 5); }
        #targets .target-row:nth-child(7) { animation-delay: calc(var(--stagger-step) * 6); }
        #targets .target-row:nth-child(8) { animation-delay: calc(var(--stagger-step) * 7); }

        @keyframes row-in {
            from { opacity: 0; transform: translateY(8px) scale(.985); }
        }

        .target-row:active { border-color: var(--border-strong); transform: scale(.98); }

        .target-row:last-child { margin-bottom: 0; }

        .target-row .grow { flex: 1; min-width: 0; }

        .target-row .grow strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
        }

        .grow { flex: 1; min-width: 0; }

        .btn-block { width: 100%; margin-top: 12px; }

        .seg {
            display: flex;
            background: var(--inset);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 3px;
            gap: 3px;
        }

        .seg-btn {
            flex: 1;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text2);
            font-size: 13px;
            font-weight: 600;
            padding: 7px 0;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color var(--dur-effects-default) var(--ease-effects-default),
                color var(--dur-effects-default) var(--ease-effects-default),
                transform var(--dur-spatial-fast) var(--ease-spatial-fast);
        }

        .seg-btn:focus-visible { outline: 2px solid rgba(226,96,79,.55); outline-offset: -2px; }

        .seg-on { background: var(--accent); color: var(--accent-ink); }

        .seg-btn:not(.seg-on):active { background: rgba(241,236,236,.07); transform: scale(.96); }

        .lib-list { display: flex; flex-direction: column; gap: 8px; }

        .lib-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--inset);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 6px 6px 12px;
            transition: opacity var(--dur-effects-fast) var(--ease-effects-fast),
                transform var(--dur-effects-default) var(--ease-exit);
            animation: row-in var(--dur-spatial-fast) var(--ease-spatial-fast) backwards;
        }

        .lib-row.leaving { opacity: 0; transform: translateX(16px); }

        .lib-path {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
        }

        .lib-add { display: flex; gap: 8px; margin-top: 8px; }

        .lib-add input { flex: 1; min-width: 0; }

        #detail-body > :first-child { margin-top: 0; }

        .slotrow { display: flex; gap: 8px; align-items: center; padding-left: 12px; }

        .slotrow .btn { flex: 0 0 auto; }

        .slotrow > span::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--faint);
            margin-right: 8px;
            vertical-align: 1px;
        }

        .slotrow > span.status-ok::before { background: var(--success); box-shadow: 0 0 4px var(--success); }
        .slotrow > span.status-warn::before { background: var(--warn); box-shadow: 0 0 4px var(--warn); }
        .slotrow > span.status-err::before { background: var(--danger); box-shadow: 0 0 4px var(--danger); }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .row-gap { gap: 8px; }

        .field { margin-top: 12px; }
        .field label { font-size: 11px; line-height: 1.5; text-transform: uppercase; letter-spacing: .12em; color: var(--text2); display: block; margin-bottom: 6px; font-weight: 600; }

        .btn {
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            background: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
            transition: background-color var(--dur-effects-default) var(--ease-effects-default),
                opacity var(--dur-effects-default) var(--ease-effects-default),
                border-color var(--dur-effects-default) var(--ease-effects-default),
                transform var(--dur-spatial-fast) var(--ease-spatial-fast);
        }

        .btn:active { background: rgba(241,236,236,.06); transform: scale(.96); }
        .btn:focus-visible { outline: 2px solid rgba(226,96,79,.55); outline-offset: 1px; }

        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .btn-primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
        .btn-primary:active { background: #c9503f; }
        .btn-danger { background: rgba(207,111,94,.13); border-color: rgba(207,111,94,.45); color: #e09583; }
        .btn-success { background: rgba(78,164,124,.15); border-color: rgba(78,164,124,.5); color: #82c79e; }
        .btn:disabled { opacity: .55; cursor: wait; }

        @keyframes slideup {
            from { opacity: 0; transform: translate(-50%, 12px) scale(.96); }
        }

        .savepill {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: none;
            gap: 12px;
            align-items: center;
            background: #20252d;
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            padding: 8px 8px 8px 16px;
            z-index: 1500;
            max-width: 92vw;
            white-space: nowrap;
            box-shadow: 0 8px 28px rgba(0,0,0,.6);
        }

        .savepill.show { display: flex; animation: slideup var(--dur-spatial-fast) var(--ease-spatial-fast); }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn.busy { color: transparent; }

        .btn.busy::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 10px;
            height: 10px;
            margin: -7px 0 0 -7px;
            border-radius: 50%;
            border: 2px solid rgba(241,236,236,.35);
            border-top-color: #f1ecec;
            animation: spin .7s linear infinite;
        }

        .btn-primary.busy::before {
            border-color: rgba(43,16,12,.28);
            border-top-color: #2b100c;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            vertical-align: -2px;
            border-radius: 50%;
            border: 2px solid var(--text2);
            border-top-color: transparent;
            animation: spin .7s linear infinite;
        }

        .connect-block { margin-bottom: 12px; }
        .connect-block .btn { margin-top: 8px; }

        .sub { font-size: 11px; line-height: 1.5; color: var(--text2); letter-spacing: .02em; }

        @keyframes fade { from { opacity: 0; } }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px) scale(.96); }
        }

        /* Dialog container rides spatial, scrim rides effects. */
        .modal { animation: rise var(--dur-spatial-default) var(--ease-spatial-default); }

        .modal-overlay { animation: fade var(--dur-effects-default) var(--ease-effects-default); }

        @keyframes pill-pop {
            0% { transform: scale(.92); }
            60% { transform: scale(1.06); }
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: .55; }
        }

        /* Loading placeholders breathe; spinners keep linear rotation. */
        .empty:has(.spinner) { animation: pulse-soft var(--dur-effects-slow) var(--ease-effects-slow) infinite; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: var(--inset);
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea { resize: vertical; min-height: 48px; }
        textarea.mono, .cmd { font-family: var(--font-mono); }
        .mono { font-family: var(--font-mono); }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 19px;
            flex: 0 0 auto;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #3a3f47;
            border-radius: 20px;
            transition: background-color var(--dur-effects-default) var(--ease-effects-default);
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 13px;
            width: 13px;
            left: 3px;
            bottom: 3px;
            background: #c9c4b8;
            border-radius: 50%;
            transition: transform var(--dur-spatial-fast) var(--ease-spatial-fast),
                background-color var(--dur-effects-default) var(--ease-effects-default);
        }

        input:checked + .slider { background: var(--accent); }
        input:checked + .slider:before { transform: translateX(15px); background: var(--accent-ink); }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            width: 90%;
            max-width: 480px;
            max-height: 75vh;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-body {
            overflow-y: auto;
            overscroll-behavior: contain;
            flex: 1;
            margin-top: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .modal > .row { margin-bottom: 12px; }

        #detail-body { margin-top: 0; }

        .app-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-size: 13px;
            border-radius: 6px;
            transition: background-color var(--dur-effects-default) var(--ease-effects-default),
                transform var(--dur-spatial-fast) var(--ease-spatial-fast);
            animation: row-in var(--dur-spatial-fast) var(--ease-spatial-fast) backwards;
        }

        .app-row:hover { background: var(--surface2); }
        .app-row:active { transform: scale(.98); }
        .app-row .app-label { font-size: 12px; color: var(--text2); word-break: break-all; }
        .app-row-text { min-width: 0; }
        .app-row-text strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .app-icon {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            border-radius: 6px;
            background: var(--surface2);
        }

        .app-icon-lg {
            width: 40px;
            height: 40px;
            flex-basis: 40px;
            border-radius: 10px;
        }

        #detail-icon:empty { display: none; }

        #target-modal .row { gap: 12px; }

        .empty { color: var(--faint); text-align: center; padding: 12px 0; font-size: 12px; }

        .status-ok { color: var(--success); }
        .status-err { color: var(--danger); }
        .status-warn { color: var(--warn); }
        .warn { color: var(--warn); font-size: 12px; margin-top: 6px; border-left: 2px solid var(--warn); padding-left: 8px; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            line-height: 1.5;
            font-family: var(--font-mono);
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--inset);
            color: var(--text2);
            white-space: nowrap;
            border: 1px solid var(--border);
        }

        .pill::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--faint);
            flex: 0 0 auto;
        }

        .pill-on { color: var(--success); animation: pill-pop var(--dur-spatial-fast) var(--ease-spatial-fast); }
        .pill-on::before { background: var(--success); box-shadow: 0 0 4px var(--success); }

        .pill, .pill::before {
            transition: color var(--dur-effects-default) var(--ease-effects-default),
                background-color var(--dur-effects-default) var(--ease-effects-default),
                border-color var(--dur-effects-default) var(--ease-effects-default),
                box-shadow var(--dur-effects-default) var(--ease-effects-default);
        }

        .btnbar { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }

        .settings { margin-top: 12px; border-top: 1px solid var(--border); }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .setting-row:last-child { border-bottom: none; }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }

        .status-row:last-child { border-bottom: none; }

        .status-row .kv { color: var(--text2); font-size: 11px; line-height: 1.5; text-transform: uppercase; letter-spacing: .12em; }

        .status-row > span:last-child, .pill { font-variant-numeric: tabular-nums; }

        .target-row .sub, .app-row .app-label, #detail-sub {
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .cmd {
            font-size: 12px;
            line-height: 1.5;
            background: var(--inset);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            white-space: pre;
            overflow-x: auto;
            color: #d8d2c2;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>KsuFrida</h1>
            <p>Frida Gadget Injection Manager</p>
            <div class="collapse" id="dirty-wrap"><div id="dirty-badge" class="dirty"></div></div>
        </div>

        <div class="card quiet">
            <div class="card-title">
                <h3>Status</h3>
                <button class="btn btn-sm" id="btn-status">Refresh</button>
            </div>
            <div id="status-rows" class="empty"><span class="spinner"></span>Loading&hellip;</div>
        </div>

        <div class="card">
            <div class="card-title">
                <h3>Targets</h3>
                <div class="row row-gap">
                    <button class="btn btn-sm" id="btn-reload">Reload</button>
                    <button class="btn btn-primary btn-sm" id="btn-add">Add</button>
                </div>
            </div>
            <input type="text" id="target-search" placeholder="Filter targets&hellip;">
            <div class="collapse" id="targets-status-wrap"><div class="slotrow"><span id="targets-status" class="sub"></span><button class="btn btn-sm" id="targets-status-retry" style="display:none">Retry</button></div></div>
            <div id="targets" style="margin-top:12px"></div>
        </div>

        <div class="card">
            <div class="card-title">
                <h3>Gadget Config</h3>
                <span id="gadget-status"></span>
            </div>
            <textarea id="gadget-editor" class="mono" rows="5" placeholder="Loading..."></textarea>
            <div class="btnrow">
                <button class="btn btn-primary btn-sm" id="btn-save-gadget">Save Gadget Config</button>
                <button class="btn btn-sm" id="btn-reset-gadget">Reset</button>
                <button class="btn btn-sm" id="btn-refresh-gadget">Reinstall Bundled</button>
            </div>
            <div class="collapse" id="gadget-update-wrap"><div class="slotrow"><span id="gadget-update" class="sub"></span><button class="btn btn-sm" id="gadget-update-retry" style="display:none">Retry</button></div></div>
            <div class="btnrow">
                <button class="btn btn-sm" id="btn-check-gadget">Check for Updates</button>
                <button class="btn btn-sm btn-primary" id="btn-download-gadget" style="display:none"></button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <h3>Connection</h3>
                <button class="btn btn-sm" id="btn-connect">Refresh</button>
            </div>
            <div id="connect-body" class="empty"><span class="spinner"></span>Loading&hellip;</div>
            <div class="collapse" id="connect-status-wrap"><div class="slotrow"><span id="connect-status" class="sub"></span><button class="btn btn-sm" id="connect-status-retry" style="display:none">Retry</button></div></div>
        </div>
    </div>

    <div class="savepill" id="save-pill">
        <span class="sub">Unsaved changes</span>
        <button class="btn btn-success btn-sm" id="btn-save">Save Targets</button>
    </div>

    <div class="modal-overlay" id="app-modal">
        <div class="modal">
            <div class="row">
                <h3>Select App</h3>
                <button class="btn btn-sm" id="btn-close-modal">Close</button>
            </div>
            <input type="text" id="app-search" placeholder="Search packages...">
            <div class="collapse" id="app-list-hint-wrap"><div class="slotrow"><span id="app-list-hint" class="sub"></span><button class="btn btn-sm" id="app-list-hint-retry" style="display:none">Retry</button></div></div>
            <div class="modal-body" id="app-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="target-modal">
        <div class="modal">
            <div class="row">
                <span id="detail-icon"></span>
                <div class="grow">
                    <h3 id="detail-title">Target</h3>
                    <div class="sub" id="detail-sub"></div>
                </div>
                <button class="btn btn-sm btn-danger" id="btn-remove-detail">Remove</button>
            </div>
            <div class="modal-body" id="detail-body"></div>
            <button class="btn btn-block" id="btn-close-detail">Close</button>
        </div>
    </div>

    <div class="modal-overlay" id="lib-modal">
        <div class="modal">
            <div class="row">
                <div class="grow">
                    <h3>Choose library</h3>
                    <div class="sub mono" id="lib-path"></div>
                </div>
                <button class="btn btn-sm" id="btn-close-lib">Close</button>
            </div>
            <div class="collapse" id="lib-status-wrap"><div class="slotrow"><span id="lib-status" class="sub"></span><button class="btn btn-sm" id="lib-status-retry" style="display:none">Retry</button></div></div>
            <div class="modal-body" id="lib-list"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
