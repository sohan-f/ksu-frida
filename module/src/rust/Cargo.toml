[package]
name = "ksufrida-rust"
version = "0.1.0"
# Verified toolchain floor; the final `.so` strip happens in AGP, not here.
rust-version = "1.99"
edition = "2024"
description = "KsuFrida core logic (config, injection, remapping, child gating) as a staticlib linked into libzygiskfrida.so"
publish = false

[lib]
# `rlib` is for the `cargo-fuzz` harness only (the module links the `.a`
# by name in `Android.mk`); it changes no shipped artifact.
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[profile.release]
lto = true
codegen-units = 1
# Unwind (the default) is load-bearing: catch_unwind guards both FFI
# boundaries (jni.rs, child_gating.rs), so never set panic = "abort".
