[package]
name = "ksufrida-rust"
version = "0.1.0"
edition = "2024"
description = "KsuFrida core logic (config, injection, remapping, child gating) as a staticlib linked into libzygiskfrida.so"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
