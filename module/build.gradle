import org.apache.tools.ant.filters.FixCrLfFilter
import org.apache.tools.ant.filters.ReplaceTokens

import java.nio.file.Paths
import java.nio.file.Files
import java.security.MessageDigest

plugins {
    id "de.undercouch.download" version "5.7.0"
}

apply plugin: 'com.android.library'
apply from: file(rootProject.file('module.gradle'))

def nativeNdkVersion = "29.0.14206865"
def rustPlatformLevel = "30"

dependencies {
    implementation 'dev.rikka.ndk.thirdparty:cxx:1.2.0'
    implementation("io.github.vvb2060.ndk:dobby:1.2")
}

task downloadFrida(type: Download) {
    def downloadArchs = ["arm", "arm64"]
    def magiskArchs = ["arm", "arm64"]

    def sources = downloadArchs.collect{
        arch -> "https://github.com/sohan-f/knox-frida-patcher/releases/download/${fridaVersion}/frida-gadget-${fridaVersion}-android-${arch}.so.xz".toString()
    }

    def outputs = magiskArchs.collect{
        arch ->  "libgadget-${arch}.so.xz".toString()
    }

    def downloads = [sources, outputs].transpose().collectEntries()

    src downloads.keySet()
    dest "$rootDir/gadget"
    overwrite true
    onlyIfModified true
    quiet true
    eachFile { f ->
        f.name = downloads[f.sourceURL.toString()]
    }
}

android {
    namespace = "zygisk.frida"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion "37.0.0"
    ndkVersion nativeNdkVersion

    flavorDimensions += "api"

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion

        externalNativeBuild {
            ndkBuild {
                arguments += "MODULE_VERSION_CODE=$moduleVersionCode"
                arguments += "MODULE_VERSION_NAME=$moduleVersion"
            }
        }

    }
    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        ndkBuild {
            path "src/jni/Android.mk"
        }
    }

    productFlavors {
        all {
            externalNativeBuild {
                ndkBuild {
                    arguments += "API=${name.toLowerCase()}"
                }
            }
        }

        create("Zygisk") {
            dimension = "api"
        }
    }
}

// ── Rust core ────────────────────────────────────────────────────────────────
// Builds module/src/rust as a staticlib for every module ABI (cargo-ndk); the
// C++ shell in src/jni (Android.mk) links it into libzygiskfrida.so.
def rustBuildLibrary = tasks.register("buildRustLibrary", Exec) {
    group = "build"
    description = "Builds the Rust core staticlib for all module ABIs"

    workingDir = file("src/rust")

    def cargoHome = System.getenv("CARGO_HOME") ?: "${System.getProperty('user.home')}/.cargo"
    def cargoBin = file("$cargoHome/bin/cargo")
    def cargoPath = cargoBin.exists() ? cargoBin.absolutePath : "cargo"

    def sdkRoot = System.getenv("ANDROID_SDK_ROOT") ?: System.getenv("ANDROID_HOME") ?:
            "${System.getProperty('user.home')}/Android/Sdk"
    def pinnedNdk = "$sdkRoot/ndk/$nativeNdkVersion"
    def ndkHome = file(pinnedNdk).isDirectory() ? pinnedNdk
            : (System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT") ?: pinnedNdk)

    doFirst {
        if (!file(ndkHome).isDirectory()) {
            throw new GradleException("Android NDK not found at $ndkHome (set ANDROID_NDK_HOME or install NDK $nativeNdkVersion)")
        }
        logger.lifecycle("cargo-ndk using NDK: $ndkHome")
    }

    environment "ANDROID_NDK_HOME", ndkHome
    environment "ANDROID_NDK_ROOT", ndkHome
    commandLine cargoPath, "ndk",
            "-t", "armeabi-v7a", "-t", "arm64-v8a", "-t", "x86", "-t", "x86_64",
            "--platform", rustPlatformLevel,
            "build", "--release", "--lib"
}

// The Rust staticlib must exist before ndk-build checks/links it (AGP 9 runs
// ndk-build via configureNdkBuild*/buildNdkBuild* tasks, per ABI).
tasks.configureEach { task ->
    if (task.name.startsWith("configureNdkBuild") || task.name.startsWith("buildNdkBuild")) {
        task.dependsOn rustBuildLibrary
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantCapped = variant.name.capitalize()
        def buildTypeLowered = (variant.buildType ?: "release").toLowerCase()
        def flavorName = variant.hasProperty('flavorName') && variant.flavorName ?
                variant.flavorName : (variant.productFlavors ? variant.productFlavors[0][1] : "zygisk")
        def flavorLowered = flavorName.toLowerCase()

        def zipName = "${moduleName}-${moduleVersion}-${flavorLowered}-${buildTypeLowered}.zip"
        def magiskDir = file("${outDir}/magisk_module_${flavorLowered}_${buildTypeLowered}")

        def prepare = tasks.register("prepareMagiskFiles${variantCapped}", Sync) {
            dependsOn("assemble$variantCapped")
            dependsOn downloadFrida
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE

            def templatePath = "$rootDir/template/magisk_module"

            into magiskDir
            from(rootDir) {
                include 'config.json.example'
            }
            from(templatePath) {
                exclude 'module.prop'
                exclude 'customize.sh'
                exclude 'verify.sh'
            }
            from(templatePath) {
                include 'module.prop'
                expand([
                        id         : magiskModuleId,
                        name       : moduleName,
                        version    : moduleVersion,
                        versionCode: moduleVersionCode.toString(),
                        author     : moduleAuthor,
                        description: moduleDescription + " (flavor: $flavorLowered)",
                ])
                filter(FixCrLfFilter.class, eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath) {
                include("customize.sh")
                include("verify.sh")
                def tokens = [
                        "FLAVOR" : flavorLowered,
                        "MODULE_ID": magiskModuleId,
                ]
                filter(ReplaceTokens.class, tokens: tokens)
                filter(FixCrLfFilter.class, eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath + "/webroot") {
                into 'webroot'
            }
            // AGP 9 nests the strip task dir: stripped_native_libs/<Variant>/<stripTask>/out/lib
            from({
                def base = project.file("$buildDir/intermediates/stripped_native_libs/$variantCapped")
                def hits = base.listFiles()?.findAll { new File(it, "out/lib").isDirectory() }
                hits?.collect { new File(it, "out/lib").path } ?: []
            }) {
                into 'lib'
            }
            from("$rootDir/gadget") {
                exclude '.gitkeep'
                into 'gadget'
            }
            doLast {
                fileTree("$magiskDir/lib").visit { f ->
                    if (!f.directory) return
                    def srcPath = Paths.get("${f.file.absolutePath}/libzygiskfrida.so")
                    def dstPath = Paths.get("$magiskDir/lib/${f.path}.so")
                    Files.move(srcPath, dstPath)
                    new File("$magiskDir/lib/${f.path}").deleteDir()
                }

                fileTree("$magiskDir").visit { f ->
                    if (f.directory) return

                    def md = MessageDigest.getInstance("SHA-256")
                    f.file.eachByte 4096, { bytes, size ->
                        md.update(bytes, 0, size)
                    }
                    file(f.file.path + ".sha256sum").text = md.digest().encodeHex()
                }
            }
        }

        def zip = tasks.register("zip${variantCapped}", Zip) {
            dependsOn(prepare)
            from magiskDir
            archiveFileName.set(zipName)
            destinationDirectory.set(outDir)
        }

        tasks.register("push${variantCapped}", Exec) {
            dependsOn(zip)
            workingDir outDir
            commandLine "adb", "push", zipName, "/data/local/tmp/"
        }

        tasks.register("flash${variantCapped}", Exec) {
            dependsOn("push${variantCapped}")
            commandLine "adb", "shell", "su", "-c",
                    "magisk --install-module /data/local/tmp/${zipName}"
        }

        tasks.register("flashAndReboot${variantCapped}", Exec) {
            dependsOn("flash${variantCapped}")
            commandLine "adb", "shell", "reboot"
        }

        // assemble<Variant> finalizes with the module zip (matches old assembleProvider hook)
        tasks.matching { it.name == "assemble${variantCapped}" }.configureEach {
            finalizedBy(zip)
        }
    }
}
