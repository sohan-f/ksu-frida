import org.apache.tools.ant.filters.FixCrLfFilter
import org.apache.tools.ant.filters.ReplaceTokens

import java.nio.file.Paths
import java.nio.file.Files
import java.security.MessageDigest

apply plugin: 'com.android.library'
apply from: file(rootProject.file('module.gradle'))

def nativeNdkVersion = "29.0.14206865"
def rustPlatformLevel = "31"

dependencies {
    implementation 'dev.rikka.ndk.thirdparty:cxx:1.2.0'
    implementation("io.github.vvb2060.ndk:dobby:1.2")
}

def gadgetMetaUrl = "https://github.com/sohan-f/knox-frida-patcher/releases/latest/download/gadget.json"
def gadgetArchs = ["arm", "arm64"]

task fetchGadget {
    group = "build"
    description = "Fetches the pinned patched gadget from knox-frida-patcher releases (sha256-verified)"
    doLast {
        file("$rootDir/gadget").mkdirs()
        def marker = file("$rootDir/gadget/gadget.version")
        def pinsFile = file("$rootDir/gadget-pins.json")

        def fail = { msg -> throw new GradleException(msg) }

        // gadget-pins.json is authoritative: builds never follow "latest"
        // silently. To adopt a new gadget, copy version + sha256 from the
        // release gadget.json (or SHA256SUMS) into gadget-pins.json.
        def pins = null
        try {
            pins = new groovy.json.JsonSlurper().parse(pinsFile)
        } catch (Exception e) {
            fail("cannot read gadget pins at $pinsFile: ${e.message}")
        }
        def pinnedVersion = pins?.version
        def pinnedHashes = pins?.sha256
        if (!(pinnedVersion ==~ /\d+\.\d+\.\d+/)
                || !(pinnedHashes?.get("arm") ==~ /[0-9a-fA-F]{64}/)
                || !(pinnedHashes?.get("arm64") ==~ /[0-9a-fA-F]{64}/)) {
            fail("invalid gadget pins in $pinsFile: need {version: X.Y.Z, sha256: {arm, arm64}} with 64-hex digests")
        }

        def sha256Of = { File f ->
            def md = MessageDigest.getInstance("SHA-256")
            f.eachByte(65536) { bytes, size -> md.update(bytes, 0, size) }
            md.digest().encodeHex().toString()
        }

        def outputs = gadgetArchs.collectEntries { arch ->
            [(arch): file("$rootDir/gadget/libgadget-${arch}.so.xz")]
        }
        def verifyOutputs = {
            outputs.every { arch, f ->
                f.exists() && sha256Of(f).equalsIgnoreCase(pinnedHashes.get(arch).toString())
            }
        }

        // Freshness signal only: metadata is cross-checked against pins and
        // never trusted on its own. Absent metadata falls back to verified cache.
        def meta = null
        try {
            def conn = new URL(gadgetMetaUrl).openConnection()
            conn.connectTimeout = 15000
            conn.readTimeout = 30000
            meta = new groovy.json.JsonSlurper().parse(conn.inputStream)
        } catch (Exception e) {
            logger.lifecycle("gadget metadata unreachable, using verified cache: ${e.message}")
        }

        def urls = [:]
        if (meta != null) {
            def metaVersion = meta?.version
            if (!(metaVersion ==~ /\d+\.\d+\.\d+/)) {
                fail("gadget metadata has invalid version: ${metaVersion}")
            }
            if (metaVersion != pinnedVersion) {
                fail("gadget ${metaVersion} is published but pins require ${pinnedVersion};"
                        + " update gadget-pins.json to adopt it")
            }
            gadgetArchs.each { arch ->
                def u = meta?.assets?.get(arch)
                if (!(u ==~ /https:\/\/github\.com\/sohan-f\/knox-frida-patcher\/releases\/download\/\d+\.\d+\.\d+\/frida-gadget-\d+\.\d+\.\d+-android-(arm|arm64)\.so\.xz/)) {
                    fail("gadget metadata has invalid URL for ${arch}: ${u}")
                }
                def h = meta?.sha256?.get(arch)
                if (!(h ==~ /[0-9a-fA-F]{64}/)
                        || !h.toString().equalsIgnoreCase(pinnedHashes.get(arch).toString())) {
                    fail("gadget metadata sha256 for ${arch} does not match gadget-pins.json;"
                            + " refusing to download (possible metadata tampering)")
                }
                urls[arch] = u
            }
        } else {
            if (marker.exists() && marker.text.trim() == pinnedVersion && verifyOutputs()) {
                logger.lifecycle("gadget ${pinnedVersion} already fetched and verified")
                return
            }
            if (!marker.exists() || marker.text.trim() != pinnedVersion) {
                fail("gadget metadata unreachable and no cached gadget for pinned version"
                        + " ${pinnedVersion}; connect to the network and retry")
            }
            fail("cached gadget for ${pinnedVersion} failed sha256 verification;"
                    + " delete gadget/libgadget-*.so.xz and retry")
        }

        if (marker.exists() && marker.text.trim() == pinnedVersion && verifyOutputs()) {
            logger.lifecycle("gadget ${pinnedVersion} already fetched and verified")
            return
        }
        urls.each { arch, u ->
            def tmp = file("$rootDir/gadget/libgadget-${arch}.so.xz.tmp")
            try {
                def dl = new URL(u).openConnection()
                dl.connectTimeout = 15000
                dl.readTimeout = 600000
                tmp.withOutputStream { it << dl.inputStream }
                def got = sha256Of(tmp)
                if (!got.equalsIgnoreCase(pinnedHashes.get(arch).toString())) {
                    tmp.delete()
                    fail("sha256 mismatch for gadget ${pinnedVersion} arch ${arch}:"
                            + " expected ${pinnedHashes.get(arch)}, got ${got}")
                }
                if (!tmp.renameTo(outputs[arch])) {
                    outputs[arch].bytes = tmp.bytes
                    tmp.delete()
                }
            } catch (GradleException e) {
                throw e
            } catch (Exception e) {
                tmp.delete()
                fail("failed to fetch gadget ${arch}: ${e.message}")
            }
        }
        marker.text = pinnedVersion
        logger.lifecycle("fetched and verified gadget ${pinnedVersion}")
    }
}

android {
    namespace = "zygisk.frida"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion "37.0.0"
    ndkVersion nativeNdkVersion

    flavorDimensions += "api"

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion

        externalNativeBuild {
            ndkBuild {
                arguments += "MODULE_VERSION_CODE=$moduleVersionCode"
                arguments += "MODULE_VERSION_NAME=$moduleVersion"
            }
        }

    }
    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        ndkBuild {
            path "src/jni/Android.mk"
        }
    }

    productFlavors {
        all {
            externalNativeBuild {
                ndkBuild {
                    arguments += "API=${name.toLowerCase()}"
                }
            }
        }

        create("Zygisk") {
            dimension = "api"
        }
    }
}

def rustBuildLibrary = tasks.register("buildRustLibrary", Exec) {    group = "build"
    description = "Builds the Rust core staticlib for all module ABIs"

    workingDir = file("src/rust")

    def cargoHome = System.getenv("CARGO_HOME") ?: "${System.getProperty('user.home')}/.cargo"
    def cargoBin = file("$cargoHome/bin/cargo")
    def cargoPath = cargoBin.exists() ? cargoBin.absolutePath : "cargo"

    def sdkRoot = System.getenv("ANDROID_SDK_ROOT") ?: System.getenv("ANDROID_HOME") ?:
            "${System.getProperty('user.home')}/Android/Sdk"
    def pinnedNdk = "$sdkRoot/ndk/$nativeNdkVersion"
    def ndkHome = file(pinnedNdk).isDirectory() ? pinnedNdk
            : (System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT") ?: pinnedNdk)

    doFirst {
        if (!file(ndkHome).isDirectory()) {
            throw new GradleException("Android NDK not found at $ndkHome (set ANDROID_NDK_HOME or install NDK $nativeNdkVersion)")
        }
        logger.lifecycle("cargo-ndk using NDK: $ndkHome")
    }

    environment "ANDROID_NDK_HOME", ndkHome
    environment "ANDROID_NDK_ROOT", ndkHome
    commandLine cargoPath, "ndk",
            "-t", "armeabi-v7a", "-t", "arm64-v8a", "-t", "x86", "-t", "x86_64",
            "--platform", rustPlatformLevel,
            "build", "--release", "--lib"
}

// Builds the WebUI bundle (TypeScript strict + esbuild) before packaging.
def webuiDir = file("$rootDir/template/ksu_module/webroot")
def buildWebUI = tasks.register("buildWebUI", Exec) {
    group = "build"
    description = "Type-checks and bundles the WebUI"

    workingDir = webuiDir
    commandLine "sh", "-c", "npm ci --no-audit --no-fund && npm test && npm run build"

    inputs.files("$webuiDir/main.ts", "$webuiDir/package.json", "$webuiDir/package-lock.json")
    outputs.file("$webuiDir/main.js")
}

// The Rust staticlib must exist before ndk-build links it.
tasks.configureEach { task ->
    if (task.name.startsWith("configureNdkBuild") || task.name.startsWith("buildNdkBuild")) {
        task.dependsOn rustBuildLibrary
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantCapped = variant.name.capitalize()
        def buildTypeLowered = (variant.buildType ?: "release").toLowerCase()
        def flavorName = variant.hasProperty('flavorName') && variant.flavorName ?
                variant.flavorName : (variant.productFlavors ? variant.productFlavors[0][1] : "zygisk")
        def flavorLowered = flavorName.toLowerCase()

        def zipName = "${moduleName}-${moduleVersion}-${flavorLowered}-${buildTypeLowered}.zip"
        def moduleDir = file("${outDir}/ksu_module_${flavorLowered}_${buildTypeLowered}")

        def prepare = tasks.register("prepareModuleFiles${variantCapped}", Sync) {
            dependsOn("assemble$variantCapped")
            dependsOn fetchGadget
            dependsOn buildWebUI
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE

            def templatePath = "$rootDir/template/ksu_module"

            into moduleDir
            from(rootDir) {
                include 'config.json.example'
            }
            from(templatePath) {
                exclude 'module.prop'
                exclude 'customize.sh'
                exclude 'verify.sh'
                exclude 'webroot/node_modules/**'
                exclude 'webroot/src/**'
                exclude 'webroot/test/**'
                exclude 'webroot/main.ts'
                exclude 'webroot/package.json'
                exclude 'webroot/package-lock.json'
                exclude 'webroot/tsconfig.json'
                exclude 'webroot/.gitignore'
            }
            from(templatePath) {
                include 'module.prop'
                expand([
                        id         : moduleId,
                        name       : moduleName,
                        version    : moduleVersion,
                        versionCode: moduleVersionCode.toString(),
                        author     : moduleAuthor,
                        description: moduleDescription + " (flavor: $flavorLowered)",
                ])
                filter(FixCrLfFilter.class, eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath) {
                include("customize.sh")
                include("verify.sh")
                def tokens = [
                        "FLAVOR" : flavorLowered,
                        "MODULE_ID": moduleId,
                ]
                filter(ReplaceTokens.class, tokens: tokens)
                filter(FixCrLfFilter.class, eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath + "/webroot") {
                into 'webroot'
                exclude 'node_modules/**'
                exclude 'src/**'
                exclude 'test/**'
                exclude 'main.ts'
                exclude 'package.json'
                exclude 'package-lock.json'
                exclude 'tsconfig.json'
                exclude '.gitignore'
            }
            // AGP 9 nests the strip task dir: stripped_native_libs/<Variant>/<stripTask>/out/lib
            from({
                def base = project.file("$buildDir/intermediates/stripped_native_libs/$variantCapped")
                def hits = base.listFiles()?.findAll { new File(it, "out/lib").isDirectory() }
                hits?.collect { new File(it, "out/lib").path } ?: []
            }) {
                into 'lib'
            }
            from("$rootDir/gadget") {
                exclude '.gitkeep'
                into 'gadget'
            }
            doLast {
                file("$moduleDir/gadget/gadget.version").text = file("$rootDir/gadget/gadget.version").text.trim()

                fileTree("$moduleDir/lib").visit { f ->
                    if (!f.directory) return
                    def srcPath = Paths.get("${f.file.absolutePath}/libzygiskfrida.so")
                    def dstPath = Paths.get("$moduleDir/lib/${f.path}.so")
                    Files.move(srcPath, dstPath)
                    new File("$moduleDir/lib/${f.path}").deleteDir()
                }

                fileTree("$moduleDir").visit { f ->
                    if (f.directory) return

                    def md = MessageDigest.getInstance("SHA-256")
                    f.file.eachByte 4096, { bytes, size ->
                        md.update(bytes, 0, size)
                    }
                    file(f.file.path + ".sha256sum").text = md.digest().encodeHex()
                }
            }
        }

        def zip = tasks.register("zip${variantCapped}", Zip) {
            dependsOn(prepare)
            from moduleDir
            archiveFileName.set(zipName)
            destinationDirectory.set(outDir)
        }

        tasks.register("push${variantCapped}", Exec) {
            dependsOn(zip)
            workingDir outDir
            commandLine "adb", "push", zipName, "/data/local/tmp/"
        }

        tasks.register("flash${variantCapped}", Exec) {
            dependsOn("push${variantCapped}")
            commandLine "adb", "shell", "su", "-c",
                    "ksud module install /data/local/tmp/${zipName}"
        }

        tasks.register("flashAndReboot${variantCapped}", Exec) {
            dependsOn("flash${variantCapped}")
            commandLine "adb", "shell", "reboot"
        }

        tasks.matching { it.name == "assemble${variantCapped}" }.configureEach {
            finalizedBy(zip)
        }
    }
}
