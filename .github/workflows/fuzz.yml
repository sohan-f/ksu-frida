name: Fuzz-Parser
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Fuzzing budget in seconds'
        default: '300'
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer parse_config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Clippy harness
        run: |
          cd module/src/rust/fuzz
          RUSTFLAGS="--cfg fuzzing" cargo clippy --all-targets -- -D warnings

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz
        run: |
          cd module/src/rust/fuzz
          cargo fuzz run parse_config -- \
            -max_total_time=${{ github.event.inputs.fuzz_seconds || '300' }} \
            -print_final_stats=1
