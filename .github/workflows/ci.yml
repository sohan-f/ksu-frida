name: CI-Build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: module/src/rust -> target

      - name: fmt, clippy, test
        run: |
          cd module/src/rust
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  miri:
    name: Miri (nightly)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: module/src/rust -> target

      - name: Miri test
        run: |
          cd module/src/rust
          MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test

  build:
    name: Build Module
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/ksu_module/webroot/package-lock.json

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: module/src/rust -> target

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease

      - name: Get Module Info
        id: module-version
        run: |
          MODULE_VERSION=$(grep 'moduleVersion =' module.gradle | awk -F'"' '{print $2}')
          MODULE_VERSION_CODE=$(grep 'moduleVersionCode =' module.gradle | awk -F'= ' '{print $2}')
          echo "version=$MODULE_VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$MODULE_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: KsuFrida-${{ steps.module-version.outputs.version }}-release
          path: out/ksu_module_zygisk_release

      - name: Create Release ZIP
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out/ksu_module_zygisk_release
          zip -r ../KsuFrida-${{ steps.module-version.outputs.version }}.zip .

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: KsuFrida ${{ steps.module-version.outputs.version }}
          generate_release_notes: true
          files: out/KsuFrida-${{ steps.module-version.outputs.version }}.zip

      - name: Update update.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          VERSION=${{ steps.module-version.outputs.version }}
          VERSION_CODE=${{ steps.module-version.outputs.versionCode }}

          printf '{\n    "version": "%s",\n    "versionCode": %s,\n    "zipUrl": "https://github.com/%s/releases/download/%s/KsuFrida-%s.zip",\n    "changelog": "https://raw.githubusercontent.com/%s/main/changelog.md"\n}\n' "$VERSION" "$VERSION_CODE" "$GITHUB_REPOSITORY" "$VERSION" "$VERSION" "$GITHUB_REPOSITORY" > update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout main
          git add update.json
          git commit -m "update update.json for ${VERSION}" || exit 0

          git remote set-url origin "https://x-access-token:${{ secrets.PAT_PUSH_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main
